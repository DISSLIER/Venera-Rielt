<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BossAuto Moldova - Detalii automobil</title>
    <meta name="description" content="Detalii complete despre automobil si simulator leasing lunar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-accent bg-accent-one"></div>
    <div class="bg-accent bg-accent-two"></div>

    <header class="site-header compact-header">
      <div class="header-bar">
        <a href="index.html" class="menu-back">Inapoi la catalog</a>
        <a href="index.html" class="logo-wrap" aria-label="BossAuto acasa">
          <img src="logo.svg" alt="BossAuto" class="logo" />
        </a>
        <a href="index.html#contact" class="header-cta">CONTACT</a>
      </div>
    </header>

    <main class="car-page reveal">
      <section id="carDetails" class="car-detail-card"></section>

      <section class="leasing-card" aria-label="Simulator leasing">
        <p class="section-caption">Finantare</p>
        <h2>Simulator leasing</h2>

        <div class="leasing-grid">
          <label>
            Pret automobil (MDL)
            <input id="leasePrice" type="number" min="0" step="10000" />
          </label>
          <label>
            Avans (MDL)
            <input id="leaseDownPayment" type="number" min="0" step="10000" />
          </label>
          <label>
            Termen (luni)
            <input id="leaseTerm" type="number" min="6" max="96" step="1" value="36" />
          </label>
          <label>
            Dobanda anuala (%)
            <input id="leaseRate" type="number" min="0" max="40" step="0.1" value="11.5" />
          </label>
        </div>

        <button id="leaseCalcBtn" class="hero-button calc-btn">Calculeaza rata</button>

        <div class="lease-result" id="leaseResult">
          <p>Rata lunara:</p>
          <strong id="monthlyPayment">0 MDL</strong>
          <span id="leaseMeta"></span>
        </div>
      </section>
    </main>

    <script type="module" src="car.js"></script>
  </body>
</html>
